name: EchoScope AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install pyright bandit

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Static type check with Pyright
        run: pyright

      - name: Run test suite with statement & branch coverage
        run: pytest -v --cov=src/echoscope --cov-branch --cov-report=term-missing --cov-fail-under=70

      - name: Security SAST with Bandit
        run: bandit -r src -ll
