[project]
name = "echoscope-ai"
version = "0.2.0"
description = "YouTube Competitive Intelligence & Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "EchoScope Team" }
]
dependencies = [
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "streamlit-aggrid>=1.1.0",
    "google-api-python-client>=2.140.0",
    "google-genai>=1.0.0",
    "isodate>=0.7.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.390",
]

[project.scripts]
echoscope = "echoscope.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "ui"]
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
